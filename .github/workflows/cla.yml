name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # Pinned to a commit: this job holds a write token and runs for pull requests from forks.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          # The action commits signatures to this branch, so it must exist and stay unprotected;
          # main can then be protected. Create it once: an orphan branch with an empty commit.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: jaheme127,dependabot[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
