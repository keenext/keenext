# Development Nextcloud with this app mounted. See README "Development".
#   docker compose up -d        → http://localhost:8091  (admin / admin)
#   NEXTCLOUD_VERSION=35 docker compose up -d
services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34}
    ports:
      - "${KEEPASSWEB_PORT:-8091}:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud:/var/www/html
      - ./appinfo:/var/www/html/custom_apps/keepassweb/appinfo:ro
      - ./lib:/var/www/html/custom_apps/keepassweb/lib:ro
      - ./templates:/var/www/html/custom_apps/keepassweb/templates:ro
      - ./img:/var/www/html/custom_apps/keepassweb/img:ro
      - ./js:/var/www/html/custom_apps/keepassweb/js:ro
      - ./css:/var/www/html/custom_apps/keepassweb/css:ro
      - ./l10n:/var/www/html/custom_apps/keepassweb/l10n:ro
      - ./tests/fixtures:/fixtures:ro
      - ./docker/hooks:/docker-entrypoint-hooks.d:ro

volumes:
  nextcloud:
